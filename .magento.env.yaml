# SCD configs
stage:
    global:
        SCD_ON_DEMAND: true
        SKIP_SCD: false
    build:
        VERBOSE_COMMANDS: "-vv"
        SCD_THREADS: 4
        SCD_STRATEGY: "standard"
        SCD_MAX_EXECUTION_TIME: 900
        SCD_MATRIX:
            "Magento/backend":
                language:
                    - en_US
                    - pt_BR
            "digitalhub/theme-itatiaia":
                language:
                    - pt_BR
            "digitalhub/theme-itatiaia-mobile":
    deploy:
        CRON_CONSUMERS_RUNNER:
            cron_run: true
            max_messages: 10000
            consumers: []
        CLEAN_STATIC_FILES: false
        SCD_MATRIX:
            "Magento/backend": []
            "Magento/luma": []
            "Magento/blank": []
        SEARCH_CONFIGURATION:
            engine: elasticsearch6
            _merge: true
        MYSQL_USE_SLAVE_CONNECTION: true
        REDIS_USE_SLAVE_CONNECTION: true
        ENABLE_GOOGLE_ANALYTICS: true


