stage:
  global:
    SCD_ON_DEMAND: true

  deploy:
    MYSQL_USE_SLAVE_CONNECTION: true
    DATABASE_CONFIGURATION:
      connection:
        default:
          driver_options:
            !php/const:\PDO::MYSQL_ATTR_LOCAL_INFILE: 1
        readonly:
          driver_options:
            !php/const:\PDO::MYSQL_ATTR_LOCAL_INFILE: 1
      _merge: true
    RESOURCE_CONFIGURATION:
      _merge: true
      readonly:
        connection: readonly
    ENABLE_GOOGLE_ANALYTICS: true
    CLEAN_STATIC_FILES: true
    REDIS_USE_SLAVE_CONNECTION: true
    SEARCH_CONFIGURATION:
      engine: elasticsuite
      _merge: true
    CRON_CONSUMERS_RUNNER:
        cron_run: true
        max_messages: 10000
        consumers: []

  build:
    SCD_THREADS: 4
    SCD_STRATEGY: standard
    SCD_MAX_EXECUTION_TIME: 3600
    VERBOSE_COMMANDS: "-vv"
    SCD_MATRIX:
      "Magento/Backend":
        language:
          - en_US
          - pt_BR
      "DigitalHub/base":
        language:
          - en_US
          - pt_BR
      "DigitalHub/base_mobile":
        language:
          - en_US
          - pt_BR
      "DigitalHub/theme-itatiaia-mobile":
        language:
          - en_US
          - pt_BR
      "DigitalHub/theme-itatiaia":
        language:
          - en_US
          - pt_BR
    QUALITY_PATCHES:
      - MDVA-30977
