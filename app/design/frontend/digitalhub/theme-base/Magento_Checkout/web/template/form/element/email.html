<div class="step-title" translate="'Identificação'" data-role="title" />

<form class="form form-login" data-role="email-with-possible-login"
      data-bind="submit:login"
      method="post">

    <fieldset id="customer-email-fieldset" class="fieldset" data-bind="blockLoader: isLoading">
        <div class="field required">
            <label class="label" for="customer-email">
                <span data-bind="i18n: 'Digite seu e-mail para continuar:'"></span>
            </label>
            <div class="control">
                <input class="input-text"
                       type="email"
                       data-bind="
                            textInput: email"
                       name="username"
                       data-validate="{required:true, 'validate-email':true}"
                       id="customer-email" />
            </div>
        </div>

        <div class="field">
            <div class="control">
                <button type="submit" class="action login primary" data-bind="click: continueEmail, visible: isContinueEmailVisible">
                    <span data-bind="i18n: 'Continuar'"></span>
                </button>
            </div>
        </div>

        <!--Hidden fields -->
        <fieldset class="fieldset hidden-fields" data-bind="visible: isPasswordVisible">
            <div class="field">
                <label class="label" for="customer-password">
                    <span data-bind="i18n: 'Senha'"></span>
                </label>
                <div class="control">
                    <input class="input-text"
                           data-bind="
                                attr: {
                                    placeholder: $t('optional'),
                                }"
                           type="password"
                           name="password"
                           id="customer-password"
                           data-validate="{required:true}" autocomplete="off"/>
                </div>
            </div>
            <!-- ko foreach: getRegion('additional-login-form-fields') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
            <div class="actions-toolbar">
                <input name="context" type="hidden" value="checkout" />
                <div class="primary">
                    <button type="submit" class="action login primary" data-action="checkout-method-login"><span data-bind="i18n: 'Fazer login'"></span></button>
                </div>
                <div class="secondary">
                    <a class="action remind" data-bind="attr: { href: forgotPasswordUrl }">
                        <span data-bind="i18n: 'Esqueceu sua senha?'"></span>
                    </a>
                </div>
            </div>
        </fieldset>
        <!--Hidden fields -->
    </fieldset>
</form>
<!-- /ko -->
