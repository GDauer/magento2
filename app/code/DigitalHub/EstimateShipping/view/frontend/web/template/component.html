<div class="estimate-shipping-box">
  <!-- ko if: window.estimateShipping.isExternal -->
    <div class="field">
        <input type="text" id="qty" placeholder="Quantidade">
    </div>
    <!-- /ko -->
    <div class="field">
        <input type="text" id="estimate-shipping-postcode" placeholder="CEP" data-bind="value: postcode, afterRender: afterRender">
        <a data-bind="click: estimateShipping" class="button">Calcular frete</a>
    </div>
</div>

<div class="estimate-shipping-result-container">
    <!-- ko if: showLoader -->
    <span class="loader">
        <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
        <span class="text">Calculando seu frete...</span>
    </span>
    <!-- /ko -->

    <!-- ko if: showSelectionAlert -->
    <div class="message notice">
        <span>Por favor, selecione as opções do produto para continuar com o cálculo do seu frete.</span>
    </div>
    <!-- /ko -->

    <!-- ko if: errorMessage -->
    <div class="message error">
        <span data-bind="text: errorMessage"></span>
    </div>
    <!-- /ko -->

    <!-- ko if: estimateResult -->
    <div class="estimate-shipping-result">
        <a class="btn-close" href="#" data-bind="click: closeResults">[fechar]</a>
        <p class="title">Opções entrega:</p>
        <ul data-bind="foreach: estimateResult">
            <!-- ko if: !error_message -->
            <li>
                <span data-bind="text: title"></span> - <strong data-bind="text: price_formatted"></strong>
            </li>
            <!-- /ko -->
            <!-- ko if: error_message -->
            <li>
                <div class="alert alert-warning" data-bind="text: error_message"></div>
            </li>
            <!-- /ko -->
        </ul>
    </div>
    <!-- /ko -->
</div>
