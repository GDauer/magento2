"var image_list":"Lista de imagens externas"
} @-->
<!doctype html>
<html lang="pt">
<head>
    <title>Alerta de detecção de imagens externas</title>
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css?family=Fira+Sans:400,500&display=swap');

        * {
            font-family: 'Fira Sans', sans-serif !important;
        }

        .pure-table {
            border-collapse: collapse;
            border-spacing: 0;
            empty-cells: show;
            border: 1px solid #cbcbcb
        }

        .pure-table caption {
            color: #000;
            font: italic 85%/1 arial, sans-serif;
            padding: 1em 0;
            text-align: center;
        }

        .pure-table td, .pure-table th {
            border-left: 1px solid #cbcbcb;
            border-width: 0 0 0 1px;
            font-size: inherit;
            margin: 0;
            overflow: visible;
            padding: .5em 1em;
        }

        .pure-table thead {
            background-color: #e0e0e0;
            color: #000;
            text-align: left;
            vertical-align: bottom;
        }

        .pure-table td {
            background-color: transparent;
        }

        .pure-table-odd td {
            background-color: #f2f2f2;
        }

        .pure-table-striped tr:nth-child(2n-1) td {
            background-color: #f2f2f2;
        }

        .pure-table-bordered td {
            border-bottom: 1px solid #cbcbcb;
        }

        .pure-table-bordered tbody > tr:last-child > td {
            border-bottom-width: 0;
        }

        .pure-table-horizontal td, .pure-table-horizontal th {
            border-width: 0 0 1px 0;
            border-bottom: 1px solid #cbcbcb;
        }

        .pure-table-horizontal tbody > tr:last-child > td {
            border-bottom-width: 0;
        }
    </style>
</head>
<body>
<h3>Aviso de imagens externas</h3>
<p>Olá! Detectamos que as seguintes imagens estão hospedadas em servidores externos:</p>
{{block class='Magento\\Framework\\View\\Element\\Template' area='frontend'template='Itatiaia_ValidateImages::email/external_images_list.phtml' remoteImages=$image_list}}
</body>
</html>
