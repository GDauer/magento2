name: app

type: php:7.1
build:
    flavor: composer

runtime:
    extensions:
        - memcached
        - redis
        - xsl
        - json
        - mcrypt

relationships:
    redis: "cache:redis"
    memcachedcache: "cachemc:memcached"
    elasticsearch: "elasticsearch:elasticsearch"

web:
    locations:
        "/":
            # The public directory of the app, relative to its root.
            root: "pub"
            # The front-controller script to send non-static requests to.
            passthru: "/index.php"
            index:
                - index.php
            expires: -1
            scripts: true
            allow: false
            headers:
                Access-Control-Allow-Origin: "*"
            rules:
                \.(css|js|map|hbs|gif|jpe?g|png|tiff|wbmp|ico|jng|bmp|svgz|midi?|mp?ga|mp2|mp3|m4a|ra|weba|3gpp?|mp4|mpe?g|mpe|ogv|mov|webm|flv|mng|asx|asf|wmv|avi|ogx|swf|jar|ttf|eot|woff|otf|html?)$:
                    allow: true
        "/media":
            root: "pub/media"
            allow: true
            scripts: false
            headers:
                Access-Control-Allow-Origin: "*"
                Access-Control-Allow-Credentials: "true"
                Access-Control-Allow-Headers: "X-Requested-With"
            expires: 1y
            passthru: "/get.php"
        "/static":
            root: "pub/static"
            allow: true
            scripts: false
            headers:
                Access-Control-Allow-Origin: "*"
                Access-Control-Allow-Credentials: "true"
                Access-Control-Allow-Headers: "X-Requested-With"
            expires: 1y
            passthru: "/front-static.php"
            rules:
                ^/static/version\d+/(?<resource>.*)$:
                    passthru: "/static/$resource"


# The size of the persistent disk of the application (in MB).
disk: 4608

# The mounts that will be performed when the package is deployed
mounts:
    "var": "shared:files/var"
    "var/view_preprocessed": "shared:files/var/view_preprocessed"
    "app/etc": "shared:files/etc"
    "pub/media": "shared:files/media"
    "pub/static": "shared:files/static"
#    "vendor/squizlabs/php_codesniffer": "shared:files/php_codesniffer"
hooks:
    # We run build hooks before your application has been packaged...
    build: |
        set -e
        php ./vendor/bin/ece-tools build:generate
        # The following fixes the config : show fatal errors
        php ./vendor/bin/phpcs --config-set installed_paths ./vendor/magento-ecg/coding-standard
        php ./vendor/bin/phpcs --config-set show_progress 1
        cat ./vendor/squizlabs/php_codesniffer/CodeSniffer.conf

    # We run deploy hook after your application has been deployed and started.
    deploy: |
        php ./bin/magento cache:status
        php ./bin/magento cache:enable
        php ./vendor/bin/ece-tools deploy
    # We run post deploy hook to clean and warm the cache. Available with ECE-Tools 2002.0.10.
    post_deploy: |
        php ./vendor/bin/ece-tools post-deploy

crons:
    cronrun:
        spec: "* * * * *"
        cmd: "php bin/magento cron:run"

