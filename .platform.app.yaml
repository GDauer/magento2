name: app

type: php:7.1
build:
    flavor: composer

runtime:
    extensions:
        - memcached
        - redis
        - xsl
        - json
        - mcrypt

relationships:
    redis: "cache:redis"
    memcachedcache: "cachemc:memcached"
    elasticsearch: "elasticsearch:elasticsearch"

web:
    locations:
        "/":
            root: "pub"
            passthru: "/index.php"
            index:
                - index.php
            expires: -1
            scripts: true
            allow: false
            headers:
                Access-Control-Allow-Origin: "*"
            rules:
                \.(css|js|map|hbs|gif|jpe?g|png|tiff|wbmp|ico|jng|bmp|svgz|midi?|mp?ga|mp2|mp3|m4a|ra|weba|3gpp?|mp4|mpe?g|mpe|ogv|mov|webm|flv|mng|asx|asf|wmv|avi|ogx|swf|jar|ttf|eot|woff|otf|html?)$:
                    allow: true
        "/media":
            root: "pub/media"
            allow: true
            scripts: false
            headers:
                Access-Control-Allow-Origin: "*"
                Access-Control-Allow-Credentials: "true"
                Access-Control-Allow-Headers: "X-Requested-With"
            expires: 1y
            passthru: "/get.php"
        "/static":
            root: "pub/static"
            allow: true
            scripts: false
            headers:
                Access-Control-Allow-Origin: "*"
                Access-Control-Allow-Credentials: "true"
                Access-Control-Allow-Headers: "X-Requested-With"
            expires: 1y
            passthru: "/front-static.php"
            rules:
                ^/static/version\d+/(?<resource>.*)$:
                    passthru: "/static/$resource"


# The size of the persistent disk of the application (in MB).
disk: 4608

# The mounts that will be performed when the package is deployed
mounts:
    "/.global":
        source: local
        source_path: "global"
    "/var":
        source: local
        source_path: "var"
    "/generated":
        source: local
        source_path: "generated"
    "/pub/media":
        source: local
        source_path: "media"
    "/pub/static":
        source: local
        source_path: "static"
    "/vendor":
        source: local
        source_path: "vendor"
    "/.config":
        source: local
        source_path: "config"
    "/.composer":
        source: local
        source_path: "composer"
hooks:
    build: |
        set -e
        composer install
    deploy: |
        php ./bin/magento setup:upgrade
        php ./bin/magento cache:status
    post_deploy: |
        php ./bin/magento cache:enable

crons:
    cronrun:
        spec: "* * * * *"
        cmd: "php bin/magento cron:run"

